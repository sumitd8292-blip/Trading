name: Order-Flow Agent Run

on:
  # DISABLED (18 Aug 2026): superseded by continuous_runner.py running
  # 24x7 on the VPS (static IP, no Groww 403 blocking issues). This
  # workflow's random GitHub Actions IPs get 401/403'd by Groww and were
  # spamming duplicate failure messages to the same Telegram bot the VPS
  # uses. Keeping the file (for workflow_dispatch / manual testing only)
  # but the schedule trigger is commented out.
  # schedule:
  #   - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch: {}   # allows manual "Run workflow" trigger for testing

permissions:
  contents: write   # required so the "Commit updated logs" step can push back to the repo

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROWW_API_KEY: ${{ secrets.GROWW_API_KEY }}
          GROWW_API_SECRET: ${{ secrets.GROWW_API_SECRET }}
        run: |
          python3 run_agent_check.py

      - name: Commit updated logs
        run: |
          git config user.name "order-flow-agent-bot"
          git config user.email "agent@github-actions"
          git add memory/trade_log.jsonl memory/alerted_signals.jsonl data/daily_store/ || true
          git diff --staged --quiet || git commit -m "Auto: agent run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
